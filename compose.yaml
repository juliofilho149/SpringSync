services:
  postgres:
    image: postgres:16
    container_name: sync-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: